    // Manejo de carga directa y optimización WebP/Canvas
    let targetUploadCharId = null;
    function triggerUploadImage(charId) {
      targetUploadCharId = charId;
      const loader = document.getElementById("cms-file-loader");
      loader.value = "";
      loader.click();
    }

    document.getElementById("cms-file-loader").addEventListener("change", function(e) {
      const file = e.target.files[0];
      if (!file || !targetUploadCharId) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const img = new Image();
        img.onload = async function() {
          // Redimensión y compresión en Canvas a WebP ligero (<100KB)
          const canvas = document.createElement("canvas");
          const ctx = canvas.getContext("2d");

          const MAX_WIDTH = 600;
          const MAX_HEIGHT = 900;
          let width = img.width;
          let height = img.height;

          if (width > height) {
            if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
          } else {
            if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
          }

          canvas.width = width;
          canvas.height = height;
          ctx.drawImage(img, 0, 0, width, height);

          const compressedBase64 = canvas.toDataURL("image/webp", 0.8);
          await fs.collection("characters").doc(targetUploadCharId).set({
            image: compressedBase64
          }, { merge: true });

          alert("Ilustración actualizada y sincronizada en tiempo real.");
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    });

    function initNTypeMapEngine() {
      if (leafletMap) {
        leafletMap.remove();
        leafletMap = null;
      }

      const canvas = document.getElementById('leaflet-map-canvas');
      if (!canvas) return;

      const imageUrl = "https://i.ibb.co/W4JcbTk0/mapa-en-progreso-2.jpg";
      const imageWidth = 3013;
      const imageHeight = 2953;

      leafletMap = L.map('leaflet-map-canvas', {
        crs: L.CRS.Simple,
        minZoom: -3,
        maxZoom: 3,
        attributionControl: false
      });

      const bounds = [[0, 0], [imageHeight, imageWidth]];
      L.imageOverlay(imageUrl, bounds).addTo(leafletMap);
      leafletMap.fitBounds(bounds);
      leafletMap.invalidateSize();

      loadMapData();

      leafletMap.on('draw:created', e => {
        const layer = e.layer;
        if (e.layerType === 'marker') {
          const latlng = layer.getLatLng();
          currentMapTempData = { lat: latlng.lat, lng: latlng.lng };
          editingMapType = 'marker';
          editingMapIndex = -1;
          selectedMapIcon = '📍';
          openMapModal('Nuevo Marcador');
        } else if (e.layerType === 'polygon') {
          const latlngs = layer.getLatLngs()[0];
          currentMapTempData = { latlngs };
          editingMapType = 'zone';
          editingMapIndex = -1;
          openMapModal('Nueva Zona');
        }
        layer.remove();
      });
    }

    function loadMapData() {
      const saved = localStorage.getItem('mapData_v3');
      if (saved) {
        try {
          const data = JSON.parse(saved);
          mapMarkers = data.markers || [];
          mapZones = data.zones || [];
          mapMarkers.forEach(m => createLeafletMarker(m));
          mapZones.forEach(z => createLeafletZone(z));
        } catch (err) {
          console.warn("Error parseando datos del mapa:", err);
        }
      }
      renderMapLists();
      updateMapZoneTooltips();
      const chk = document.getElementById('map-permanent-labels');
      if (chk) chk.checked = permanentZoneLabels;
    }

    function saveMapData() {
      localStorage.setItem('mapData_v3', JSON.stringify({
        markers: mapMarkers.map(m => ({ id: m.id, name: m.name, desc: m.desc, icon: m.icon, lat: m.lat, lng: m.lng })),
        zones: mapZones.map(z => ({ id: z.id, name: z.name, color: z.color, latlngs: z.latlngs }))
      }));
    }

    function createLeafletMarker(data) {
      const iconHtml = `<div style="font-size:32px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6));">${data.icon || '📍'}</div>`;
      const icon = L.divIcon({ className: 'custom-marker', html: iconHtml, iconSize: [40, 40], iconAnchor: [20, 20], popupAnchor: [0, -20] });
      const marker = L.marker([data.lat, data.lng], { icon }).addTo(leafletMap)
        .bindPopup(`<b>${data.name}</b><br><small>${data.desc || ''}</small>`);
      data.leafletLayer = marker;
    }

    function createLeafletZone(data) {
      const poly = L.polygon(data.latlngs, { color: data.color, fillColor: data.color, fillOpacity: 0.35, weight: 2 })
        .addTo(leafletMap);
      data.leafletLayer = poly;
      updateMapZoneTooltips();
    }

    function updateMapZoneTooltips() {
      mapZones.forEach(z => {
        if (z.leafletLayer) {
          z.leafletLayer.unbindTooltip();
          z.leafletLayer.bindTooltip(z.name, {
            permanent: permanentZoneLabels,
            direction: 'center',
            className: 'zone-label',
            offset: [0, 0]
          });
        }
      });
    }

    function togglePermanentZoneLabels() {
      permanentZoneLabels = document.getElementById('map-permanent-labels').checked;
      updateMapZoneTooltips();
    }

    function toggleMapSidebar() {
      document.getElementById('map-sidebar').classList.toggle('translate-x-[-100%]');
    }

    function startMapAddMarker() {
      if (leafletMap) new L.Draw.Marker(leafletMap).enable();
    }

    function startMapDrawZone() {
      if (leafletMap) new L.Draw.Polygon(leafletMap, { shapeOptions: { color: '#22d3ee', fillOpacity: 0.35 } }).enable();
    }

    function openMapModal(title) {
      document.getElementById('map-modal-title').textContent = title;
      document.getElementById('map-modal').classList.remove('hidden');

      const isMarker = (editingMapType === 'marker');
      document.getElementById('map-icon-picker').classList.toggle('hidden', !isMarker);
      document.getElementById('map-color-container').classList.toggle('hidden', isMarker);

      if (isMarker) renderMapIconPicker();

      if (editingMapIndex >= 0) {
        const item = isMarker ? mapMarkers[editingMapIndex] : mapZones[editingMapIndex];
        document.getElementById('map-item-name').value = item.name || '';
        document.getElementById('map-item-desc').value = item.desc || '';
        if (!isMarker) document.getElementById('map-item-color').value = item.color || '#22d3ee';
        if (isMarker) selectedMapIcon = item.icon || '📍';
      } else {
        document.getElementById('map-item-name').value = '';
        document.getElementById('map-item-desc').value = '';
        if (!isMarker) document.getElementById('map-item-color').value = '#22d3ee';
      }
    }

    function renderMapIconPicker() {
      const picker = document.getElementById('map-icon-picker');
      picker.innerHTML = mapIcons.map(icon => `
        <button type="button" onclick="selectMapIcon('${icon}')" class="w-10 h-10 flex items-center justify-center text-xl rounded-xl transition ${selectedMapIcon === icon ? 'bg-cyan-500 scale-110 shadow-lg' : 'bg-slate-800 hover:bg-slate-700'}">
          ${icon}
        </button>
      `).join("");
    }

    function selectMapIcon(icon) {
      selectedMapIcon = icon;
      renderMapIconPicker();
    }

    function closeMapModal() {
      document.getElementById('map-modal').classList.add('hidden');
      editingMapIndex = -1;
      editingMapType = null;
    }

    function saveMapModalItem() {
      const name = document.getElementById('map-item-name').value.trim();
      if (!name) { alert("Ingresa un nombre."); return; }

      const desc = document.getElementById('map-item-desc').value.trim();
      const color = document.getElementById('map-item-color').value || '#22d3ee';

      if (editingMapIndex >= 0) {
        if (editingMapType === 'marker') {
          const item = mapMarkers[editingMapIndex];
          item.name = name; item.desc = desc; item.icon = selectedMapIcon;
          item.leafletLayer.remove();
          createLeafletMarker(item);
        } else {
          const item = mapZones[editingMapIndex];
          item.name = name; item.color = color;
          item.leafletLayer.remove();
          createLeafletZone(item);
        }
      } else {
        const newItem = { id: Date.now(), name, desc };
        if (editingMapType === 'marker') {
          newItem.icon = selectedMapIcon;
          newItem.lat = currentMapTempData.lat;
          newItem.lng = currentMapTempData.lng;
          mapMarkers.push(newItem);
          createLeafletMarker(newItem);
        } else {
          newItem.color = color;
          newItem.latlngs = currentMapTempData.latlngs;
          mapZones.push(newItem);
          createLeafletZone(newItem);
        }
      }

      saveMapData();
      renderMapLists();
      closeMapModal();
    }

    function renderMapLists() {
      const ml = document.getElementById('map-markers-list');
      if (!ml) return;
      ml.innerHTML = mapMarkers.map((m, i) => `
        <li class="flex items-center justify-between bg-slate-900/80 hover:bg-slate-800 p-2.5 rounded-xl text-xs cursor-pointer border border-slate-800/60" onclick="focusMapMarker(${i})">
          <div class="flex items-center gap-2 truncate">
            <span class="text-base">${m.icon || '📍'}</span>
            <span class="font-bold text-slate-200 truncate">${m.name}</span>
          </div>
          <div class="flex gap-1.5 ml-2" onclick="event.stopPropagation()">
            <button onclick="editMapItem('marker', ${i})" class="text-amber-400 hover:text-amber-300">✏️</button>
            <button onclick="deleteMapMarker(${i})" class="text-rose-400 hover:text-rose-300">🗑</button>
          </div>
        </li>
      `).join("") || `<li class="text-[11px] text-slate-500">Sin marcadores registrados.</li>`;

      const zl = document.getElementById('map-zones-list');
      if (!zl) return;
      zl.innerHTML = mapZones.map((z, i) => `
        <li class="flex items-center justify-between bg-slate-900/80 hover:bg-slate-800 p-2.5 rounded-xl text-xs cursor-pointer border border-slate-800/60" onclick="focusMapZone(${i})">
          <div class="flex items-center gap-2 truncate">
            <div class="w-3.5 h-3.5 rounded-full flex-shrink-0" style="background:${z.color}"></div>
            <span class="font-bold text-slate-200 truncate">${z.name}</span>
          </div>
          <div class="flex gap-1.5 ml-2" onclick="event.stopPropagation()">
            <button onclick="editMapItem('zone', ${i})" class="text-amber-400 hover:text-amber-300">✏️</button>
            <button onclick="deleteMapZone(${i})" class="text-rose-400 hover:text-rose-300">🗑</button>
          </div>
        </li>
      `).join("") || `<li class="text-[11px] text-slate-500">Sin zonas delimitadas.</li>`;
    }

    function focusMapMarker(i) {
      const m = mapMarkers[i];
      if (leafletMap && m.leafletLayer) {
        leafletMap.flyTo([m.lat, m.lng], 1.5);
        m.leafletLayer.openPopup();
      }
    }

    function focusMapZone(i) {
      const z = mapZones[i];
      if (leafletMap && z.leafletLayer) {
        leafletMap.fitBounds(z.leafletLayer.getBounds(), { padding: [40, 40] });
      }
    }

    function editMapItem(type, i) {
      editingMapType = type;
      editingMapIndex = i;
      openMapModal(type === 'marker' ? 'Editar Marcador' : 'Editar Zona');
    }

    function deleteMapMarker(i) {
      if (confirm("¿Eliminar este marcador?")) {
        mapMarkers[i].leafletLayer.remove();
        mapMarkers.splice(i, 1);
        saveMapData();
        renderMapLists();
      }
    }

    function deleteMapZone(i) {
      if (confirm("¿Eliminar esta zona?")) {
        mapZones[i].leafletLayer.remove();
        mapZones.splice(i, 1);
        saveMapData();
        renderMapLists();
      }
    }

    function openAuthModal() { document.getElementById("auth-modal").classList.remove("hidden"); }
    function closeAuthModal() { document.getElementById("auth-modal").classList.add("hidden"); }

    function setAuthMode(mode) {
      authMode = mode;
      document.getElementById("tab-login").classList.toggle("bg-rose-500", mode === "login");
      document.getElementById("tab-login").classList.toggle("text-white", mode === "login");
      document.getElementById("tab-login").classList.toggle("text-slate-400", mode !== "login");

      document.getElementById("tab-register").classList.toggle("bg-rose-500", mode === "register");
      document.getElementById("tab-register").classList.toggle("text-white", mode === "register");
      document.getElementById("tab-register").classList.toggle("text-slate-400", mode !== "register");

      document.getElementById("auth-email-group").classList.toggle("hidden", mode === "login");
      document.getElementById("auth-submit-btn").textContent = mode === "register" ? "Crear Cuenta" : "Iniciar Sesión";
    }

    async function handleAuth(e) {
      e.preventDefault();
      const txt_user = document.getElementById("auth-user").value.trim();
      const txt_pass = document.getElementById("auth-pass").value;
      const txt_email = document.getElementById("auth-email").value.trim();
      const msg = document.getElementById("auth-msg");
      const user_clean = cleanUsername(txt_user);

      msg.className = "text-center text-xs font-semibold text-amber-400";
      msg.textContent = "Conectando...";

      if (authMode === "login") {
        try {
          const snap = await db.ref('usernames/' + user_clean).once('value');
          const userData = snap.val();
          if (userData && userData.pass === txt_pass) {
            loginSuccess(userData.uid, txt_user);
          } else {
            msg.className = "text-center text-xs font-semibold text-rose-400";
            msg.textContent = userData ? "Contraseña incorrecta." : "El usuario no existe.";
          }
        } catch (err) {
          msg.className = "text-center text-xs font-semibold text-rose-400";
          msg.textContent = "Error de conexión.";
        }
      } else {
        try {
          const snap = await db.ref('usernames/' + user_clean).once('value');
          if (snap.exists()) {
            msg.className = "text-center text-xs font-semibold text-rose-400";
            msg.textContent = "Nombre ya en uso.";
            return;
          }
          const now = new Date();
          const uid = `usr_${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}${Math.floor(100000 + Math.random() * 900000)}`;

          await db.ref('usernames/' + user_clean).set({ uid: uid, email: txt_email, pass: txt_pass });
          await db.ref('users/' + uid).set({
            info: { username: txt_user, email: txt_email, avatar: "", rol: user_clean === "catteru2" ? "admin" : "user", pastel_equipado: "pastel_aurora" },
            inventario: { enjoirs: 0, dulucks: 0, tickets: 0 },
            stats: { nivel: 1, racha_maxima: 0, total_partidas: 0, total_victorias: 0, total_asesinatos: 0 }
          });
          loginSuccess(uid, txt_user);
        } catch (err) {
          msg.className = "text-center text-xs font-semibold text-rose-400";
          msg.textContent = "Error al crear cuenta.";
        }
      }
    }

    function loginSuccess(uid, username) {
      activeUID = uid;
      currentUsername = username;
      localStorage.setItem("jopjoir_uid", uid);
      localStorage.setItem("jopjoir_username", username);

      closeAuthModal();
      db.ref('users/' + uid).on('value', (snap) => {
        currentUserData = snap.val() || null;
        updateUserHeader();
        renderMainContent();
      });
    }

    function logout() {
      localStorage.removeItem("jopjoir_uid");
      localStorage.removeItem("jopjoir_username");
      activeUID = null;
      currentUsername = null;
      currentUserData = null;
      updateUserHeader();
      renderMainContent();
    }

      if (toolId === "ranking" || toolId === "checkin" || toolId === "characters" || toolId === "map" || toolId === "achieve" || toolId === "banners") {
        activeSubTool = toolId;

      } else if (toolId === "play") {
        window.open("https://play.google.com/store/apps/details?id=com.dugick.jopjoir&hl=es", "_blank");

      renderMainContent();
    }

      list.innerHTML = gamesData.map(game => `
        <label class="flex items-center justify-between p-2.5 rounded-lg bg-slate-900 border border-slate-800 cursor-pointer">
          <span class="text-xs font-bold text-slate-200">${game.name}</span>
          <input type="checkbox" onchange="toggleGameVisibility('${game.id}', this.checked)" ${game.isEnabled ? 'checked' : ''} class="w-4 h-4 accent-rose-500">
        </label>
      `).join("");
    }

    window.toggleGameVisibility = function(id, isChecked) {
      const g = gamesData.find(item => item.id === id);
      if (g) {
        g.isEnabled = isChecked;
        renderTabs();
        renderMainContent();
      }
    };

    // Arranque
    renderTabs();
    updateUserHeader();
    renderMainContent();
  </script>
</body>
</html>
